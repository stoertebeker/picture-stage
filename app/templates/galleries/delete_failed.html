{% extends "base.html" %}

{% block title %}{{ t('gallery.delete_failed_title') }}{% endblock %}

{% block content %}
<section class="mx-auto max-w-xl px-4 py-12">
    <div role="alert" class="rounded-md border border-status-danger bg-surface-raised p-6">
        <h1 class="font-display text-2xl text-text-primary">{{ t('gallery.delete_failed_title') }}</h1>
        <p class="mt-3 text-sm text-text-secondary">{{ t('gallery.delete_failed_message') }}</p>
        <a href="{{ return_url }}" class="mt-6 inline-flex rounded-md bg-accent px-4 py-2 text-sm font-medium text-text-on-accent hover:bg-accent-hover">{{ t('gallery.delete_return') }}</a>
    </div>
</section>
{% endblock %}
